<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#6366f1">
    <title>生活管理面板</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body>
    <!-- 登录/注册页 -->
    <div id="auth-page" class="auth-page">
        <div class="auth-card">
            <h1>生活管理面板</h1>
            <p class="auth-subtitle">多用户 · 数据隔离 · 保密柜加密</p>
            <div class="auth-tabs">
                <button class="auth-tab active" data-mode="login">登录</button>
                <button class="auth-tab" data-mode="register">注册</button>
            </div>
            <input type="text" id="auth-username" placeholder="用户名" class="auth-input" />
            <input type="password" id="auth-password" placeholder="密码" class="auth-input" />
            <input type="password" id="auth-password-confirm" placeholder="确认密码" class="auth-input hidden" />
            <div id="security-fields" class="hidden">
                <select id="auth-security-question" class="auth-input">
                    <option value="">选择密保问题</option>
                    <option value="你的宠物叫什么名字？">你的宠物叫什么名字？</option>
                    <option value="你最喜欢的食物是什么？">你最喜欢的食物是什么？</option>
                    <option value="你出生在哪个城市？">你出生在哪个城市？</option>
                    <option value="你母亲的姓名是什么？">你母亲的姓名是什么？</option>
                    <option value="你小学叫什么名字？">你小学叫什么名字？</option>
                </select>
                <input type="text" id="auth-security-answer" placeholder="密保答案" class="auth-input" />
            </div>
            <button id="auth-submit" class="auth-btn">登录</button>
            <p id="auth-error" class="auth-error"></p>
            <button id="forgot-password-link" class="forgot-link">忘记密码？</button>
        </div>
    </div>

    <!-- 忘记密码弹窗 -->
    <div class="modal hidden" id="forgot-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>找回密码</h2>
                <button id="forgot-modal-close">✕</button>
            </div>
            <!-- Step 1: 输入用户名 -->
            <div id="forgot-step1">
                <input type="text" id="forgot-username" placeholder="输入你的用户名" class="modal-input" />
                <button id="forgot-get-question" class="auth-btn">下一步</button>
                <p id="forgot-step1-error" class="auth-error"></p>
                <button id="forgot-request-admin" class="forgot-link" style="margin-top:16px">密保也忘了？找管理员重置</button>
            </div>
            <!-- Step 2: 回答密保问题 + 设置新密码 -->
            <div id="forgot-step2" class="hidden">
                <p id="forgot-display-question" class="forgot-question-text"></p>
                <p id="forgot-admin-approved-msg" class="forgot-question-text" style="color:var(--success);display:none">✓ 管理员已批准你的重置请求，请设置新密码</p>
                <input type="text" id="forgot-answer" placeholder="输入密保答案" class="modal-input" />
                <input type="password" id="forgot-new-password" placeholder="输入新密码（至少4位）" class="modal-input" />
                <input type="password" id="forgot-new-password-confirm" placeholder="确认新密码" class="modal-input" />
                <button id="forgot-reset" class="auth-btn">重置密码</button>
                <p id="forgot-step2-error" class="auth-error"></p>
                <button id="forgot-request-admin-2" class="forgot-link" style="margin-top:16px">密保也忘了？找管理员重置</button>
            </div>
            <!-- Step 3: 成功 -->
            <div id="forgot-step3" class="hidden">
                <div class="forgot-success-icon">✓</div>
                <p>密码已重置成功！请用新密码登录。</p>
                <button id="forgot-done" class="auth-btn">好的</button>
            </div>
            <!-- Step 4: 管理员重置请求 -->
            <div id="forgot-step4" class="hidden">
                <div class="forgot-success-icon">📨</div>
                <p>已向管理员发送重置请求</p>
                <p style="font-size:13px;color:var(--text-dim);margin-top:8px">管理员批准后，你可以在这里重新设置新密码。请留意管理员的
